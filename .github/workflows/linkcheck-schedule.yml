name: Weekly link check

on:
  schedule:
    - cron: "0 13 * * 1"  # Mondays 13:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - id: check
        name: Run linkcheck
        run: |
          set +e
          python tools/linkcheck.py
          echo "exit=$?" >> "$GITHUB_OUTPUT"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-linkcheck-report
          path: tools/_linkcheck_report.md
      - name: Open issue on failure
        if: steps.check.outputs.exit != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('tools/_linkcheck_report.md', 'utf8');
            const title = `Weekly linkcheck found broken links (${new Date().toISOString().slice(0,10)})`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['linkcheck', 'maintenance']
            });
